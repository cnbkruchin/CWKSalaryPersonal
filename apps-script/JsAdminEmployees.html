<script>
  App.views.adminEmployees = function (root) {
    root.innerHTML = App.adminShell('employees', '<div id="employees-body" class="p-4 sm:p-6"><p class="text-gray-400">กำลังโหลด...</p></div>');
    loadEmployees();

    function loadEmployees(includeInactive) {
      App.call('listEmployees', !!includeInactive).then(function (rows) {
        renderTable(rows, !!includeInactive);
      }).catch(function (err) { App.toast(err.message, 'error'); });
    }

    function renderTable(rows, includeInactive) {
      var body = document.getElementById('employees-body');
      body.innerHTML =
        '<div class="flex items-center justify-between mb-4 flex-wrap gap-3">' +
          '<h1 class="text-xl font-bold">ทะเบียนลูกจ้าง (' + rows.length + ' คน)</h1>' +
          '<div class="flex items-center gap-3">' +
            '<label class="text-sm text-gray-500 flex items-center gap-1.5"><input type="checkbox" id="chk-inactive" ' + (includeInactive ? 'checked' : '') + '> แสดงที่ปิดใช้งาน</label>' +
            '<button id="btn-add-emp" class="btn btn-primary">+ เพิ่มลูกจ้าง</button>' +
          '</div>' +
        '</div>' +
        '<div class="card overflow-x-auto"><table class="table-clean w-full">' +
          '<thead><tr><th>รหัส</th><th>ชื่อ-สกุล</th><th>กลุ่มงาน</th><th>บัญชีธนาคาร</th><th>ปกส.</th><th>การเข้าใช้</th><th>สถานะ</th><th></th></tr></thead>' +
          '<tbody>' + rows.map(rowHtml).join('') + '</tbody>' +
        '</table></div>';

      document.getElementById('chk-inactive').onchange = function (e) { loadEmployees(e.target.checked); };
      document.getElementById('btn-add-emp').onclick = openAddModal;
      rows.forEach(function (r) {
        var editBtn = document.getElementById('edit-' + cssId(r.employeeId));
        if (editBtn) editBtn.onclick = function () { openEditModal(r); };
        var toggleBtn = document.getElementById('toggle-' + cssId(r.employeeId));
        if (toggleBtn) toggleBtn.onclick = function () { toggleStatus(r); };
        var resetBtn = document.getElementById('reset-' + cssId(r.employeeId));
        if (resetBtn) resetBtn.onclick = function () { resetPin(r); };
      });
    }

    function cssId(id) { return String(id).replace(/[^a-zA-Z0-9]/g, '_'); }

    function rowHtml(r) {
      var id = cssId(r.employeeId);
      return '<tr>' +
        '<td class="font-mono text-xs">' + App.esc(r.employeeId) + '</td>' +
        '<td>' + App.esc((r.prefixName || '') + r.firstName + ' ' + r.lastName) + (r.role === 'admin' ? ' <span class="badge bg-brand-50 text-brand-700">ผู้ดูแลระบบ</span>' : '') + '</td>' +
        '<td>' + App.esc(r.group || '-') + '</td>' +
        '<td class="font-mono text-xs">' + App.esc(r.bankName || '') + ' ' + App.esc(r.bankAccountNo || '') + '</td>' +
        '<td>' + (r.hasSSO ? '<span class="badge badge-approved">มี</span>' : '<span class="text-gray-300">-</span>') + '</td>' +
        '<td class="text-xs">' + (r.lastLoginAt ? App.esc(App.dateTime(r.lastLoginAt)) : '<span class="text-gray-400">ยังไม่เคย</span>') +
          (r.mustChangePin ? '<div class="text-amber-700">ใช้รหัสชั่วคราว</div>' : '') + '</td>' +
        '<td>' + (r.status === 'active' ? '<span class="badge badge-approved">ใช้งาน</span>' : '<span class="badge badge-draft">ปิดใช้งาน</span>') + '</td>' +
        '<td class="text-right whitespace-nowrap">' +
          '<button id="edit-' + id + '" class="btn btn-secondary !px-2 !py-1 text-xs">แก้ไข</button> ' +
          '<button id="reset-' + id + '" class="btn btn-secondary !px-2 !py-1 text-xs">รีเซ็ตรหัส</button> ' +
          '<button id="toggle-' + id + '" class="btn ' + (r.status === 'active' ? 'btn-danger' : 'btn-secondary') + ' !px-2 !py-1 text-xs">' + (r.status === 'active' ? 'ปิดใช้งาน' : 'เปิดใช้งาน') + '</button>' +
        '</td></tr>';
    }

    function toggleStatus(r) {
      var next = r.status === 'active' ? 'inactive' : 'active';
      App.confirm('ต้องการเปลี่ยนสถานะของ "' + r.firstName + '" เป็น ' + (next === 'active' ? 'ใช้งาน' : 'ปิดใช้งาน') + ' ใช่หรือไม่?').then(function (ok) {
        if (!ok) return;
        App.call('setEmployeeStatus', r.employeeId, next).then(function () {
          App.toast('บันทึกแล้ว', 'success');
          loadEmployees(document.getElementById('chk-inactive').checked);
        }).catch(function (err) { App.toast(err.message, 'error'); });
      });
    }

    function resetPin(r) {
      App.confirm('ออกรหัสชั่วคราวใหม่ให้ "' + r.firstName + '" และปลดล็อกบัญชี? รหัสเดิมจะใช้ไม่ได้ทันที').then(function (ok) {
        if (!ok) return;
        App.call('adminResetPin', r.employeeId).then(function (res) {
          showTempPin(r.employeeId, res.newPin);
          loadEmployees(document.getElementById('chk-inactive').checked);
        }).catch(function (err) { App.toast(err.message, 'error'); });
      });
    }

    function showTempPin(employeeId, pin) {
      App.modalHtml(
        '<h3 class="text-lg font-bold mb-2">รหัสชั่วคราวสำหรับ ' + App.esc(employeeId) + '</h3>' +
        '<p class="text-sm text-gray-600 mb-3">แจ้งรหัสนี้กับเจ้าของบัญชีโดยตรง (ไม่ส่งในกลุ่มแชต) ระบบจะบังคับให้ตั้งรหัสใหม่ทันทีที่เข้าใช้งาน รหัสนี้จะไม่แสดงอีก</p>' +
        '<div class="text-3xl font-mono font-bold tracking-widest text-center bg-brand-50 text-brand-900 rounded-xl py-4 select-all">' + App.esc(pin) + '</div>' +
        '<div class="flex justify-end pt-4"><button id="pin-done" class="btn btn-primary">รับทราบ</button></div>', 'max-w-sm');
      document.getElementById('pin-done').onclick = App.closeModal;
    }

    function openAddModal() {
      App.modalHtml(employeeFormHtml(null));
      bindEmployeeForm(null);
    }

    function openEditModal(r) {
      App.modalHtml(employeeFormHtml(r));
      bindEmployeeForm(r);
    }

    function employeeFormHtml(r) {
      var isEdit = !!r;
      return (
        '<h3 class="text-lg font-bold mb-4">' + (isEdit ? 'แก้ไขข้อมูลลูกจ้าง' : 'เพิ่มลูกจ้างใหม่') + '</h3>' +
        '<form id="emp-form" class="grid grid-cols-1 sm:grid-cols-2 gap-3">' +
          (isEdit ? '' :
            '<div><label class="label">รหัสพนักงาน *</label><input id="f-id" class="input" placeholder="เช่น Cwk023" pattern="[A-Za-z0-9_\\-]{2,20}" required></div>' +
            '<div><label class="label">ประเภทบัญชี</label><select id="f-role" class="input"><option value="employee">ลูกจ้าง (ดูสลิปของตัวเอง)</option><option value="admin">ผู้ดูแลระบบ (เจ้าหน้าที่การเงิน)</option></select></div>') +
          '<div><label class="label">คำนำหน้า</label><input id="f-prefix" class="input" value="' + App.esc(r ? r.prefixName : '') + '"></div>' +
          '<div><label class="label">ชื่อ *</label><input id="f-first" class="input" required value="' + App.esc(r ? r.firstName : '') + '"></div>' +
          '<div class="sm:col-span-2"><label class="label">นามสกุล</label><input id="f-last" class="input" value="' + App.esc(r ? r.lastName : '') + '"></div>' +
          '<div><label class="label">กลุ่มงาน</label>' + groupSelect(r ? r.group : '') + '</div>' +
          '<div><label class="label">ตำแหน่ง/รายละเอียด</label><input id="f-position" class="input" value="' + App.esc(r ? r.position : '') + '"></div>' +
          '<div><label class="label">วันที่เริ่มงาน</label><input id="f-start" type="date" class="input" value="' + App.esc(r ? r.startDate : '') + '"></div>' +
          (isEdit ? '' : '<div><label class="label">เดือนเริ่มนับเงินเดือน (YYYY-MM)</label><input id="f-startmonth" class="input" placeholder="' + App.currentMonthKey() + '"></div>') +
          '<div><label class="label">ธนาคาร</label><input id="f-bank" class="input" value="' + App.esc(r ? r.bankName : '') + '"></div>' +
          '<div><label class="label">เลขที่บัญชี</label><input id="f-account" class="input" inputmode="numeric" value="' + App.esc(r ? r.bankAccountNo : '') + '"></div>' +
          '<div><label class="label">เลขบัตรประชาชน 13 หลัก / หนังสือเดินทาง</label><input id="f-citizen" class="input" value="' + App.esc(r ? r.citizenID : '') + '"></div>' +
          '<div><label class="label">เบอร์โทร</label><input id="f-phone" class="input" inputmode="tel" value="' + App.esc(r ? r.phone : '') + '"></div>' +
          (isEdit ? '' : '<div><label class="label">อัตราเงินเดือนเริ่มต้น</label><input id="f-salary" type="number" step="0.01" class="input"></div>') +
          '<div><label class="label">ประเภทการจ้าง (หมายเหตุ 2 ในรายงาน)</label><select id="f-emptype" class="input">' +
            ['', 'ลูกจ้าง มี ปกส.', 'จ้างเหมาบริการ', 'งบเขต', 'อื่นๆ'].map(function (t) {
              return '<option value="' + t + '"' + (r && r.employmentType === t ? ' selected' : '') + '>' + (t || '— อัตโนมัติจากสถานะ ปกส. —') + '</option>';
            }).join('') + '</select></div>' +
          '<div class="flex items-center gap-2 pt-6"><input type="checkbox" id="f-sso" ' + (r && r.hasSSO ? 'checked' : '') + '><label for="f-sso" class="text-sm">มีการหักสมทบประกันสังคม (ปกส.)</label></div>' +
          '<div class="sm:col-span-2"><label class="label">หมายเหตุ</label><input id="f-note" class="input" value="' + App.esc(r ? r.note : '') + '"></div>' +
          '<div class="sm:col-span-2 flex justify-end gap-2 pt-2">' +
            '<button type="button" id="emp-cancel" class="btn btn-secondary">ยกเลิก</button>' +
            '<button type="submit" class="btn btn-primary">บันทึก</button>' +
          '</div>' +
        '</form>'
      );
    }

    function groupSelect(current) {
      var groups = ['ครูอัตราจ้าง', 'เจ้าหน้าที่', 'พนักงานขับรถ', 'ภารโรง', 'แม่บ้าน', 'ยามรักษาการณ์', 'อื่นๆ'];
      return '<select id="f-group" class="input">' + groups.map(function (g) {
        return '<option ' + (g === current ? 'selected' : '') + '>' + g + '</option>';
      }).join('') + '</select>';
    }

    function bindEmployeeForm(existing) {
      document.getElementById('emp-cancel').onclick = App.closeModal;
      document.getElementById('emp-form').onsubmit = function (ev) {
        ev.preventDefault();
        var form = {
          prefixName: val('f-prefix'), firstName: val('f-first'), lastName: val('f-last'),
          group: val('f-group'), position: val('f-position'), startDate: val('f-start'),
          bankName: val('f-bank'), bankAccountNo: val('f-account'), citizenID: val('f-citizen'),
          phone: val('f-phone'), hasSSO: document.getElementById('f-sso').checked, note: val('f-note'), employmentType: val('f-emptype')
        };
        var promise;
        if (existing) {
          promise = App.call('updateEmployee', existing.employeeId, form);
        } else {
          form.employeeId = val('f-id');
          form.startMonth = val('f-startmonth');
          form.baseSalary = val('f-salary');
          form.role = val('f-role');
          promise = App.call('addEmployee', form);
        }
        var btn = ev.target.querySelector('button[type=submit]');
        btn.disabled = true;
        promise.then(function (res) {
          App.toast('บันทึกสำเร็จ', 'success');
          if (res && res.initialPin) showTempPin(res.employeeId, res.initialPin); else App.closeModal();
          loadEmployees();
        }).catch(function (err) { btn.disabled = false; App.toast(err.message, 'error'); });
      };
    }

    function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
  };
</script>
