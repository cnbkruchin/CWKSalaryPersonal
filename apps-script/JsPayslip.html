<script>
  /** ตั้งขนาดกระดาษ/ขอบกระดาษสำหรับการพิมพ์ครั้งถัดไป (เพราะแต่ละรายงานใช้ขนาดกระดาษไม่เท่ากัน) */
  App.setPrintPageStyle = function (css) {
    document.getElementById('page-size-style').textContent = css;
  };

  /**
   * สร้าง HTML ของสลิปเงินเดือน 1 ใบ (A5 แนวนอน) ใช้ร่วมกันทั้งฝั่งแอดมิน (พิมพ์รวม) และพนักงาน (ดูของตัวเอง)
   * จัดหมวดหมู่รายการตามแบบฟอร์มสลิปเดิมของโรงเรียน (เงินเดือน/เงินประจำตำแหน่ง/ค่าขึ้นเวร/รับอื่นๆ ฯลฯ)
   */
  App.renderPayslip = function (s) {
    var row = function (label, amount) {
      return '<tr><td>' + App.esc(label) + '</td><td class="amt">' + App.money(amount) + '</td><td class="unit">บาท</td></tr>';
    };
    var otherRows = (s.otherDeductions || []).map(function (d) { return row(d.label, d.amount); }).join('');
    var notes = [s.otherIncomeNote, s.backPayNote].filter(function (n) { return n; });

    return (
      '<div class="payslip">' +
        '<div class="payslip-header">' +
          '<img src="' + App.SCHOOL_LOGO + '" alt="ตราโรงเรียน">' +
          '<div><div class="school">' + App.esc(s.schoolName) + '</div>' +
          '<div class="title">' + App.esc(s.schoolAddress || '') + '</div></div>' +
        '</div>' +
        '<div class="payslip-info">' +
          '<div>ประจำเดือน <b>' + App.esc(s.monthLabel) + '</b></div>' +
          '<div class="name">ชื่อ-นามสกุล : ' + App.esc(s.fullName) + '</div>' +
          '<div class="row"><span>ตำแหน่ง : ' + App.esc(s.position || s.group || '-') + '</span>' +
          '<span>เลขที่บัญชี : ' + App.esc(s.bankAccountNo || '-') + '</span></div>' +
        '</div>' +
        '<div class="payslip-grid">' +
          '<div class="payslip-box"><h4>รายรับ</h4><table>' +
            row('เงินเดือน', s.baseSalary) +
            row('เงินประจำตำแหน่ง', s.positionAllowance) +
            row('ค่าขึ้นเวร', s.onDutyPay) +
            row('รับอื่นๆ' + (s.otherIncomeNote ? ' (' + App.esc(s.otherIncomeNote) + ')' : ''), s.otherIncome) +
            (s.backPay ? row('เงินตกเบิก' + (s.backPayNote ? ' (' + App.esc(s.backPayNote) + ')' : ''), s.backPay) : '') +
            '<tr class="sum">' + '<td>รวมรับ</td><td class="amt">' + App.money(s.grossPay) + '</td><td class="unit">บาท</td></tr>' +
          '</table></div>' +
          '<div class="payslip-box"><h4>รายจ่าย</h4><table>' +
            row('ประกันสังคม', s.ssoEmployee) +
            otherRows +
            row('กองทุนทดแทน', s.compFundEmployer) +
            '<tr class="sum"><td>รวมหัก</td><td class="amt">' + App.money(s.totalDeduction) + '</td><td class="unit">บาท</td></tr>' +
          '</table></div>' +
        '</div>' +
        '<div class="payslip-net">' +
          '<div><span class="label">คงเหลือสุทธิ</span> <span class="amount">' + App.money(s.netPay) + '</span> บาท</div>' +
          '<div class="text">(' + App.esc(s.netPayText) + ')</div>' +
        '</div>' +
        (notes.length ? '<div class="payslip-note">*หมายเหตุ ' + notes.map(App.esc).join(' &middot; ') + '</div>' : '') +
        '<div class="payslip-footer">' +
          '<div>ลงชื่อ.................................................เจ้าหน้าที่การเงิน<br>' +
          '(' + App.esc(s.financeOfficerName || '.............................') + ')</div>' +
        '</div>' +
      '</div>'
    );
  };

  /** แสดงหน้าพิมพ์สลิปเต็มหน้าจอ (แทนที่ #app-root) รองรับหลายใบต่อครั้ง */
  App.showPrintView = function (slips, title, backHash) {
    App.setPrintPageStyle('@page { size: A5 landscape; margin: 6mm; }');
    var root = document.getElementById('app-root');
    root.innerHTML =
      '<div class="max-w-5xl mx-auto p-4">' +
        '<div class="no-print flex items-center justify-between mb-4">' +
          '<h2 class="text-lg font-bold">' + App.esc(title || 'พิมพ์สลิปเงินเดือน') + '</h2>' +
          '<div class="flex gap-2">' +
            '<button id="btn-back" class="btn btn-secondary">กลับ</button>' +
            '<button id="btn-print" class="btn btn-primary">พิมพ์ / บันทึกเป็น PDF</button>' +
          '</div>' +
        '</div>' +
        '<div id="print-area">' + slips.map(App.renderPayslip).join('') + '</div>' +
      '</div>';
    document.getElementById('btn-print').onclick = function () { window.print(); };
    document.getElementById('btn-back').onclick = function () { App.router.go(backHash || '/'); };
  };
</script>
