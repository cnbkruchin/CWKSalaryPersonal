<script>
  /** ตั้งขนาดกระดาษ/ขอบกระดาษสำหรับการพิมพ์ครั้งถัดไป (เพราะแต่ละรายงานใช้ขนาดกระดาษไม่เท่ากัน) */
  App.setPrintPageStyle = function (css) {
    document.getElementById('page-size-style').textContent = css;
  };

  /**
   * สร้าง HTML ของสลิปเงินเดือน 1 ใบ (A5 แนวนอน) ใช้ร่วมกันทั้งฝั่งแอดมิน (พิมพ์รวม) และพนักงาน (ดูของตัวเอง)
   * จัดหมวดหมู่รายการตามแบบฟอร์มสลิปเดิมของโรงเรียน (เงินเดือน/เงินประจำตำแหน่ง/ค่าขึ้นเวร/รับอื่นๆ ฯลฯ)
   */
  App.renderPayslip = function (s) {
    var bi = function (th, en) { return App.esc(th) + ' <span class="en">' + en + '</span>'; };
    var row = function (labelHtml, amount) {
      return '<tr><td>' + labelHtml + '</td><td class="amt">' + App.money(amount) + '</td><td class="unit">บาท</td></tr>';
    };
    var otherRows = (s.otherDeductions || []).map(function (d) { return row(App.esc(d.label), d.amount); }).join('');
    var notes = [s.note, s.otherIncomeNote, s.backPayNote].filter(function (n) { return n; });
    var note = function (n) { return n ? ' <span class="text-gray-500">(' + App.esc(n) + ')</span>' : ''; };

    return (
      '<div class="payslip">' +
        '<div class="payslip-header">' +
          '<img src="' + App.SCHOOL_LOGO + '" alt="ตราโรงเรียน">' +
          '<div class="flex-1"><div class="school">' + App.esc(s.schoolName) + '</div>' +
          '<div class="title">' + App.esc(s.schoolAddress || '') + '</div></div>' +
          '<div class="text-right"><div class="font-bold text-brand-900">สลิปเงินเดือน</div><div class="en">PAYSLIP</div></div>' +
        '</div>' +
        '<div class="payslip-info">' +
          '<div>' + bi('ประจำเดือน', 'Pay period') + ' <b>' + App.esc(s.monthLabel) + '</b> <span class="en">' + App.esc(App.monthName(s.month, 'en')) + '</span></div>' +
          '<div class="name">' + bi('ชื่อ-นามสกุล', 'Name') + ' : ' + App.esc(s.fullName) + ' <span class="en font-normal">(' + App.esc(s.employeeId) + ')</span></div>' +
          '<div class="row"><span>' + bi('ตำแหน่ง', 'Position') + ' : ' + App.esc(s.position || s.group || '-') + '</span>' +
          '<span>' + bi('เลขที่บัญชี', 'Account') + ' : ' + App.esc(s.bankAccountNo || '-') + '</span></div>' +
        '</div>' +
        '<div class="payslip-grid">' +
          '<div class="payslip-box"><h4>' + bi('รายรับ', 'Earnings') + '</h4><table>' +
            row(bi('เงินเดือน', 'Salary'), s.baseSalary) +
            row(bi('เงินประจำตำแหน่ง', 'Position allowance'), s.positionAllowance) +
            row(bi('ค่าขึ้นเวร', 'Duty allowance'), s.onDutyPay) +
            row(bi('รับอื่นๆ', 'Other income') + note(s.otherIncomeNote), s.otherIncome) +
            (s.backPay ? row(bi('เงินตกเบิก', 'Back pay') + note(s.backPayNote), s.backPay) : '') +
            '<tr class="sum"><td>' + bi('รวมรับ', 'Total earnings') + '</td><td class="amt">' + App.money(s.grossPay) + '</td><td class="unit">บาท</td></tr>' +
          '</table></div>' +
          '<div class="payslip-box"><h4>' + bi('รายจ่าย', 'Deductions') + '</h4><table>' +
            row(bi('ประกันสังคม', 'Social security'), s.ssoEmployee) +
            otherRows +
            row(bi('กองทุนทดแทน', 'Compensation fund'), s.compFundEmployer) +
            '<tr class="sum"><td>' + bi('รวมหัก', 'Total deductions') + '</td><td class="amt">' + App.money(s.totalDeduction) + '</td><td class="unit">บาท</td></tr>' +
          '</table></div>' +
        '</div>' +
        '<div class="payslip-net">' +
          '<div><span class="label">' + bi('คงเหลือสุทธิ', 'Net pay') + '</span> <span class="amount">' + App.money(s.netPay) + '</span> บาท</div>' +
          '<div class="text text-right">(' + App.esc(s.netPayText) + ')' +
            (App.lang === 'en' ? '<br><span class="en">' + App.esc(App.bahtTextEn(s.netPay)) + '</span>' : '') + '</div>' +
        '</div>' +
        (notes.length ? '<div class="payslip-note">*' + bi('หมายเหตุ', 'Remarks') + ' ' + notes.map(App.esc).join(' &middot; ') + '</div>' : '') +
        '<div class="payslip-footer">' +
          (s.verifyCode
            ? '<div class="payslip-verify">' + App.qrSvg(s.verifyUrl || s.verifyCode) +
                '<div>ตรวจสอบความถูกต้องของสลิป <span class="en">Verify</span><br>สแกน QR หรือใช้รหัส<br><b class="font-mono text-[.72rem] text-gray-700">' + App.esc(s.verifyCode) + '</b>' +
                (s.paidDate ? '<br>' + bi('จ่ายเมื่อ', 'Paid') + ' ' + App.esc(App.dateShort(s.paidDate, 'th')) : '') + '</div></div>'
            : '<div class="payslip-verify">เอกสารร่าง — ยังไม่ผ่านการอนุมัติ <span class="en">DRAFT</span></div>') +
          '<div class="sign">ลงชื่อ.................................................' + App.esc(s.financeOfficerTitle || 'เจ้าหน้าที่การเงิน') + '<br>' +
          '(' + App.esc(s.financeOfficerName || '.............................') + ')</div>' +
        '</div>' +
        (s.status !== 'approved' ? '<div class="payslip-watermark">ร่าง</div>' : '') +
      '</div>'
    );
  };

  /** QR code เป็น SVG (ใช้ไลบรารี qrcode-generator) — ถ้าโหลดไลบรารีไม่ได้จะแสดงเฉพาะรหัสตัวอักษร */
  App.qrSvg = function (text) {
    try {
      if (typeof qrcode !== 'function') return '';
      var qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      return qr.createSvgTag({ cellSize: 2, margin: 0, scalable: true });
    } catch (e) {
      return '';
    }
  };

  /** ย่อสลิปขนาด A5 ให้พอดีความกว้างหน้าจอ (มือถือ) โดยไม่กระทบขนาดตอนพิมพ์ */
  App.fitSlips = function (container) {
    var wraps = (container || document).querySelectorAll('.slip-fit');
    wraps.forEach(function (wrap) {
      var slip = wrap.firstElementChild;
      if (!slip) return;
      slip.style.transform = '';
      var natural = slip.offsetWidth;
      var scale = Math.min(1, wrap.clientWidth / natural);
      slip.style.transform = scale < 1 ? 'scale(' + scale + ')' : '';
      wrap.style.height = scale < 1 ? (slip.offsetHeight * scale) + 'px' : '';
    });
  };
  window.addEventListener('resize', function () { App.fitSlips(); });

  function printShell(title, backPath, bodyHtml) {
    var root = document.getElementById('app-root');
    root.innerHTML =
      '<div class="max-w-5xl mx-auto p-4">' +
        '<div class="no-print flex items-center justify-between gap-2 mb-4 flex-wrap">' +
          '<h2 class="text-lg font-bold">' + App.esc(title) + '</h2>' +
          '<div class="flex gap-2">' +
            '<button id="btn-back" class="btn btn-secondary">' + App.t('back') + '</button>' +
            '<button id="btn-print" class="btn btn-primary"><span class="w-4 h-4">' + App.icon('print') + '</span> ' + App.t('printPdf') + '</button>' +
          '</div>' +
        '</div>' +
        '<p class="no-print text-xs text-gray-500 mb-3">' + App.t('printTip') + '</p>' +
        '<div id="print-area">' + bodyHtml + '</div>' +
      '</div>';
    document.getElementById('btn-print').onclick = function () { window.print(); };
    document.getElementById('btn-back').onclick = function () { App.router.go(backPath || App.router.home()); };
    window.scrollTo(0, 0);
  }

  /** แสดงหน้าพิมพ์สลิปเต็มหน้าจอ (แทนที่ #app-root) รองรับหลายใบต่อครั้ง — กระดาษ A5 แนวนอน */
  App.showPrintView = function (slips, title, backPath) {
    App.setPrintPageStyle('@page { size: A5 landscape; margin: 6mm; }');
    printShell(title || 'พิมพ์สลิปเงินเดือน', backPath, slips.map(App.renderPayslip).join(''));
  };

  /** แสดงเอกสารทั่วไปสำหรับพิมพ์ — กระดาษ A4 แนวตั้ง */
  App.showDocPrint = function (html, title, backPath) {
    App.setPrintPageStyle('@page { size: A4 portrait; margin: 15mm; }');
    printShell(title, backPath, '<div class="card p-8 bg-white">' + html + '</div>');
  };
</script>
