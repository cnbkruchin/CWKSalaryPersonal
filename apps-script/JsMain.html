<script>
  // ---------------- Shell / Layout ----------------

  var NAV_ITEMS = [
    { key: 'payroll', path: '/admin/payroll', label: 'รอบจ่ายเงินเดือน' },
    { key: 'salary', path: '/admin/salary', label: 'เลื่อนขั้น / ตกเบิก' },
    { key: 'employees', path: '/admin/employees', label: 'ทะเบียนลูกจ้าง' },
    { key: 'reports', path: '/admin/reports', label: 'รายงาน/เอกสาร' },
    { key: 'settings', path: '/admin/settings', label: 'ตั้งค่าระบบ' }
  ];

  App.topbar = function (title, name) {
    return (
      '<div class="no-print flex items-center justify-between px-6 py-4 bg-white border-b border-gray-200">' +
        '<div class="font-bold text-brand-900">' + App.esc(title) + '</div>' +
        '<div class="flex items-center gap-3 text-sm">' +
          '<span class="text-gray-500">' + App.esc(name || '') + '</span>' +
          '<button id="btn-change-pin" class="btn btn-secondary !px-3 !py-1.5">เปลี่ยนรหัสผ่าน</button>' +
          '<button id="btn-logout" class="btn btn-danger !px-3 !py-1.5">ออกจากระบบ</button>' +
        '</div>' +
      '</div>'
    );
  };

  App.bindTopbarActions = function () {
    var pinBtn = document.getElementById('btn-change-pin');
    var outBtn = document.getElementById('btn-logout');
    if (pinBtn) pinBtn.onclick = function () { App.showChangePinModal(false); };
    if (outBtn) outBtn.onclick = function () {
      App.call('logout').catch(function () {}).then(function () {
        App.session.clear();
        App.router.go('/login');
      });
    };
  };

  App.adminShell = function (activeKey, innerHtml) {
    var session = App.session.get();
    return (
      '<div class="min-h-screen flex">' +
        '<aside class="no-print w-60 bg-white border-r border-gray-200 flex flex-col">' +
          '<div class="px-5 py-5 border-b border-gray-100">' +
            '<div class="font-bold text-brand-900 leading-tight">ระบบเงินเดือนลูกจ้าง</div>' +
            '<div class="text-xs text-gray-400">โรงเรียนจุนวิทยาคม</div>' +
          '</div>' +
          '<nav class="flex-1 p-3 space-y-1">' +
            NAV_ITEMS.map(function (item) {
              return '<a href="#' + item.path + '" class="nav-link ' + (item.key === activeKey ? 'active' : '') + '">' + item.label + '</a>';
            }).join('') +
          '</nav>' +
        '</aside>' +
        '<div class="flex-1 min-w-0">' +
          App.topbar(NAV_ITEMS.filter(function (i) { return i.key === activeKey; }).map(function (i) { return i.label; })[0] || '', session ? session.fullName : '') +
          '<div>' + innerHtml + '</div>' +
        '</div>' +
      '</div>'
    );
  };

  // ---------------- Router ----------------

  App.router = (function () {
    var routes = {
      '/login': { view: App.views.login, mode: 'public' },
      '/admin/employees': { view: App.views.adminEmployees, mode: 'admin' },
      '/admin/salary': { view: App.views.adminSalary, mode: 'admin' },
      '/admin/payroll': { view: App.views.adminPayroll, mode: 'admin' },
      '/admin/reports': { view: App.views.adminReports, mode: 'admin' },
      '/admin/settings': { view: App.views.adminSettings, mode: 'admin' },
      '/me': { view: App.views.employeePortal, mode: 'auth' }
    };

    function parseHash() {
      var raw = location.hash.replace(/^#/, '') || '';
      var qIndex = raw.indexOf('?');
      var path = qIndex === -1 ? raw : raw.substring(0, qIndex);
      var params = {};
      if (qIndex !== -1) {
        raw.substring(qIndex + 1).split('&').forEach(function (pair) {
          if (!pair) return;
          var kv = pair.split('=');
          params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
        });
      }
      return { path: path, params: params };
    }

    function homeFor(session) {
      if (!session) return '/login';
      return session.role === 'admin' ? '/admin/payroll' : '/me';
    }

    function go(path) { location.hash = '#' + path; }

    function render() {
      var session = App.session.get();
      var parsed = parseHash();
      var path = parsed.path;

      if (!path) { go(homeFor(session)); return; }

      var route = routes[path];
      if (!route) { go(homeFor(session)); return; }

      if (route.mode === 'admin' && (!session || session.role !== 'admin')) { go(session ? homeFor(session) : '/login'); return; }
      if (route.mode === 'auth' && !session) { go('/login'); return; }
      if (route.mode === 'public' && session) { go(homeFor(session)); return; }

      var root = document.getElementById('app-root');
      route.view(root, parsed.params);
    }

    window.addEventListener('hashchange', render);
    return { go: go, render: render };
  })();

  window.addEventListener('DOMContentLoaded', function () {
    var session = App.session.get();
    if (!session) { App.router.render(); return; }
    App.api('whoAmI', session.token).then(function (info) {
      App.session.set(Object.assign({}, session, { fullName: info.fullName, role: info.role }));
      App.router.render();
    }).catch(function () {
      App.session.clear();
      App.router.render();
    });
  });
</script>
