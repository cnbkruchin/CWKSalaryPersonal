<script>
  App.views = App.views || {};
  var REMEMBER_KEY = 'cwk_last_employee';

  function brandHeader(subtitle) {
    return '<div class="text-center mb-6">' +
      '<img src="' + App.SCHOOL_LOGO + '" alt="ตราโรงเรียนจุนวิทยาคม" class="mx-auto h-16 w-auto mb-3 mix-blend-multiply">' +
      '<div class="text-lg font-bold text-brand-900">' + App.esc(subtitle) + '</div>' +
      '<div class="text-sm text-gray-500 mt-0.5">' + App.t('school') + '</div>' +
    '</div>';
  }

  // ======================= หน้าบ้าน: ลูกจ้างเข้าสู่ระบบด้วย PIN =======================
  App.views.employeeLogin = function (root) {
    var remembered = App.store.get(REMEMBER_KEY);
    var state = { step: remembered ? 'pin' : 'id', id: remembered ? remembered.id : '', firstName: remembered ? remembered.firstName : '', pin: '', busy: false };

    function render() {
      root.innerHTML =
        '<div class="login-bg min-h-screen flex flex-col items-center justify-center p-4">' +
          '<div class="w-full max-w-sm">' +
            '<div class="flex justify-end mb-2">' + App.langToggle() + '</div>' +
            brandHeader(App.t('appName')) +
            '<div class="card p-6">' + (state.step === 'id' ? idStep() : pinStep()) + '</div>' +
            '<p class="text-xs text-gray-400 text-center mt-5">' + App.t('forgot') + '</p>' +
            (App.config.appUrl ? '<p class="text-center mt-2"><a href="' + App.esc(App.config.appUrl) + '?page=admin" class="text-xs text-brand-600 hover:underline">' + App.t('staff') + '</a></p>' : '') +
          '</div>' +
        '</div>';
      App.bindLangToggle(root);
      state.step === 'id' ? bindIdStep() : bindPinStep();
    }

    function idStep() {
      return '<form id="id-form" class="space-y-4">' +
        '<div><label class="label" for="emp-id">' + App.t('employeeId') + '</label>' +
        '<input id="emp-id" class="input !text-lg !py-3" placeholder="' + App.t('idPlaceholder') + '" autocomplete="username" autocapitalize="off" spellcheck="false" required value="' + App.esc(state.id) + '"></div>' +
        '<button type="submit" class="btn btn-primary btn-lg w-full justify-center">' + App.t('next') + '</button>' +
      '</form>';
    }

    function bindIdStep() {
      var input = document.getElementById('emp-id');
      input.focus();
      document.getElementById('id-form').onsubmit = function (ev) {
        ev.preventDefault();
        state.id = input.value.trim();
        if (!state.id) return;
        state.firstName = '';
        state.step = 'pin';
        render();
      };
    }

    function pinStep() {
      var dots = '';
      for (var i = 0; i < 6; i++) dots += '<span class="pin-dot' + (i < state.pin.length ? ' filled' : '') + '"></span>';
      var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'change', '0', 'del'].map(function (k) {
        if (k === 'change') return '<button type="button" class="key key-fn" data-key="change">' + App.t('switchUser') + '</button>';
        if (k === 'del') return '<button type="button" class="key key-fn" data-key="del" aria-label="' + App.t('del') + '">' + App.t('del') + '</button>';
        return '<button type="button" class="key" data-key="' + k + '">' + k + '</button>';
      }).join('');
      return '<div class="text-center">' +
          '<div class="text-sm text-gray-500">' + (state.firstName ? App.t('hello') : App.t('employeeId')) + '</div>' +
          '<div class="text-xl font-bold text-brand-900">' + App.esc(state.firstName ? App.t('helloName', { name: state.firstName }) : state.id) + '</div>' +
          '<div class="text-sm text-gray-500 mt-3">' + App.t('enterPin') + '</div>' +
          '<div id="pin-dots" class="pin-dots" aria-live="polite" aria-label="' + App.t('pinProgress', { n: state.pin.length }) + '">' + dots + '</div>' +
          '<div id="pin-status" class="text-xs text-gray-400 h-4 mb-3">' + (state.busy ? App.t('checking') : '') + '</div>' +
        '</div>' +
        '<div class="keypad">' + keys + '</div>';
    }

    function bindPinStep() {
      root.querySelectorAll('.key').forEach(function (btn) {
        btn.onclick = function () { press(btn.getAttribute('data-key')); };
      });
      App.setKeyHandler(function (ev) {
        if (/^\d$/.test(ev.key)) press(ev.key);
        else if (ev.key === 'Backspace') press('del');
      });
    }

    function press(k) {
      if (state.busy) return;
      if (k === 'change') {
        App.store.remove(REMEMBER_KEY);
        state = { step: 'id', id: '', firstName: '', pin: '', busy: false };
        render();
        return;
      }
      if (k === 'del') state.pin = state.pin.slice(0, -1);
      else if (state.pin.length < 6) state.pin += k;
      render();
      if (state.pin.length === 6) submit();
    }

    function submit() {
      state.busy = true;
      render();
      App.api('employeeLogin', state.id, state.pin).then(function (data) {
        App.store.set(REMEMBER_KEY, { id: data.employeeId, firstName: data.firstName });
        App.session.set(data);
        App.setKeyHandler(null);
        App.afterLogin(data);
      }).catch(function (err) {
        state.busy = false;
        state.pin = '';
        render();
        var dotsEl = document.getElementById('pin-dots');
        if (dotsEl) dotsEl.classList.add('pin-shake');
        App.toast(err.message, 'error');
        if (/ไม่ถูกต้อง|Incorrect/.test(err.message) && !state.firstName) {
          // อาจพิมพ์รหัสพนักงานผิด ให้กลับไปแก้ได้ง่าย
          document.getElementById('pin-status').innerHTML = '<button type="button" id="fix-id" class="text-brand-600 underline">' + App.t('fixId') + '</button>';
          document.getElementById('fix-id').onclick = function () { state.step = 'id'; render(); };
        }
      });
    }

    render();
  };

  // ======================= หลังบ้าน: เจ้าหน้าที่เข้าสู่ระบบ =======================
  App.views.adminLogin = function (root) {
    root.innerHTML =
      '<div class="min-h-screen flex items-center justify-center p-4 bg-slate-100">' +
        '<div class="w-full max-w-sm">' +
          brandHeader('ระบบหลังบ้าน · งานเงินเดือนลูกจ้าง') +
          '<div class="card p-6">' +
            '<form id="admin-form" class="space-y-4">' +
              '<div><label class="label" for="ad-id">ชื่อผู้ใช้</label>' +
                '<input id="ad-id" class="input" autocomplete="username" autocapitalize="off" spellcheck="false" required></div>' +
              '<div><label class="label" for="ad-pw">รหัสผ่าน</label>' +
                '<div class="relative"><input id="ad-pw" type="password" class="input pr-16" autocomplete="current-password" required>' +
                '<button type="button" id="ad-toggle" class="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-brand-600 px-2 py-1">แสดง</button></div></div>' +
              '<button type="submit" class="btn btn-primary btn-lg w-full justify-center">เข้าสู่ระบบ</button>' +
            '</form>' +
            '<p class="text-xs text-gray-400 mt-4 flex items-start gap-1.5"><span class="w-4 h-4 flex-shrink-0">' + App.icon('shield') + '</span>' +
              'การเข้าใช้งานทุกครั้งถูกบันทึกเพื่อความปลอดภัย รหัสผิด 5 ครั้งบัญชีจะถูกล็อก 15 นาที</p>' +
          '</div>' +
          (App.config.appUrl ? '<p class="text-center mt-4"><a href="' + App.esc(App.config.appUrl) + '" class="text-xs text-brand-600 hover:underline">← ไปหน้าสลิปเงินเดือนของลูกจ้าง</a></p>' : '') +
        '</div>' +
      '</div>';

    document.getElementById('ad-id').focus();
    document.getElementById('ad-toggle').onclick = function () {
      var pw = document.getElementById('ad-pw');
      pw.type = pw.type === 'password' ? 'text' : 'password';
      this.textContent = pw.type === 'password' ? 'แสดง' : 'ซ่อน';
    };
    document.getElementById('admin-form').onsubmit = function (ev) {
      ev.preventDefault();
      var btn = ev.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...';
      App.api('adminLogin', document.getElementById('ad-id').value.trim(), document.getElementById('ad-pw').value).then(function (data) {
        App.session.set(data);
        App.afterLogin(data);
      }).catch(function (err) {
        App.toast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
        document.getElementById('ad-pw').value = '';
        document.getElementById('ad-pw').focus();
      });
    };
  };

  /** หลังล็อกอิน: ยอมรับ PDPA (ครั้งแรก) → ตั้งรหัสใหม่ (ถ้าจำเป็น) → เข้าหน้าหลัก */
  App.afterLogin = function (data) {
    var steps = Promise.resolve();
    if (data.needsPdpa) steps = steps.then(App.showPdpaModal);
    if (data.mustChangePin) steps = steps.then(function () { return App.showChangePinModal(true); });
    steps.then(function () {
      App.closeModal();
      var s = App.session.get();
      if (s) { s.needsPdpa = false; s.mustChangePin = false; App.session.set(s); }
      App.router.go(App.router.home());
    }).catch(function () {
      App.logout(true);
    });
  };

  App.logout = function (silent) {
    var s = App.session.get();
    App.session.clear();
    App.closeModal();
    if (s) App.api('logout', s.token).catch(function () {});
    if (!silent) App.toast(App.t('loggedOut'), 'info');
    App.router.go('/login');
  };

  // ======================= PDPA =======================
  App.showPdpaModal = function () {
    return new Promise(function (resolve, reject) {
      App.api('getPdpaNotice').catch(function () { return { schoolName: 'โรงเรียนจุนวิทยาคม', contact: 'ฝ่ายการเงินของโรงเรียน' }; }).then(function (n) {
        var vars = { school: App.esc(n.schoolName), contact: App.esc(n.contact) };
        App.modalHtml(
          '<div class="flex items-center justify-between gap-2 mb-3"><div class="flex items-center gap-2"><span class="w-6 h-6 text-brand-600">' + App.icon('shield') + '</span>' +
            '<h3 class="text-lg font-bold">' + App.t('pdpaTitle') + '</h3></div>' + (App.config.mode === 'employee' ? App.langToggle() : '') + '</div>' +
          '<div class="text-sm text-gray-700 space-y-2 max-h-[50vh] overflow-y-auto pr-1">' +
            '<p>' + App.t('pdpaIntro', vars) + '</p>' +
            '<ul class="list-disc pl-5 space-y-1">' +
              ['pdpaData', 'pdpaPurpose', 'pdpaBasis', 'pdpaAccess', 'pdpaRights'].map(function (k) { return '<li>' + App.t(k, vars) + '</li>'; }).join('') +
            '</ul>' +
          '</div>' +
          '<label class="flex items-start gap-2 mt-4 text-sm"><input type="checkbox" id="pdpa-ok" class="mt-1"> ' + App.t('pdpaAck') + '</label>' +
          '<div class="flex justify-end gap-2 pt-4">' +
            '<button type="button" id="pdpa-no" class="btn btn-secondary">' + App.t('logout') + '</button>' +
            '<button type="button" id="pdpa-yes" class="btn btn-primary" disabled>' + App.t('pdpaAccept') + '</button>' +
          '</div>'
        );
        document.getElementById('modal-root').querySelectorAll('.lang-btn').forEach(function (btn) {
          btn.onclick = function () {
            App.lang = btn.getAttribute('data-lang');
            App.store.set('cwk_lang', App.lang);
            App.showPdpaModal().then(resolve, reject);
          };
        });
        var yes = document.getElementById('pdpa-yes');
        document.getElementById('pdpa-ok').onchange = function () { yes.disabled = !this.checked; };
        document.getElementById('pdpa-no').onclick = function () { reject(new Error('declined')); };
        yes.onclick = function () {
          yes.disabled = true;
          App.call('acceptPdpa').then(resolve).catch(function (err) { yes.disabled = false; App.toast(err.message, 'error'); });
        };
      });
    });
  };

  // ======================= เปลี่ยนรหัสผ่าน / PIN =======================
  App.showChangePinModal = function (forced) {
    var isAdmin = App.config.mode === 'admin';
    var attrs = isAdmin
      ? 'type="password" autocomplete="new-password"'
      : 'type="password" inputmode="numeric" pattern="\\d{6}" maxlength="6" autocomplete="new-password"';
    return new Promise(function (resolve, reject) {
      App.modalHtml(
        '<h3 class="text-lg font-bold mb-1">' + (forced ? App.t('setNewPin') : (isAdmin ? 'เปลี่ยนรหัสผ่าน' : App.t('changePin'))) + '</h3>' +
        '<p class="text-sm text-gray-500 mb-4">' + (isAdmin
          ? 'รหัสผ่านใหม่อย่างน้อย 8 ตัวอักษร ผสมตัวอักษรและตัวเลข'
          : App.t('pinRule')) + '</p>' +
        '<form id="pin-form" class="space-y-3">' +
          '<div><label class="label" for="pin-old">' + (forced ? App.t('currentPinTemp') : App.t('currentPin')) + '</label><input id="pin-old" class="input" ' + attrs.replace('new-password', 'current-password') + ' required></div>' +
          '<div><label class="label" for="pin-new">' + App.t('newPin') + '</label><input id="pin-new" class="input" ' + attrs + ' required></div>' +
          '<div><label class="label" for="pin-new2">' + App.t('confirmPin') + '</label><input id="pin-new2" class="input" ' + attrs + ' required></div>' +
          '<div class="flex justify-end gap-2 pt-2">' +
            '<button type="button" id="pin-cancel" class="btn btn-secondary">' + (forced ? App.t('logout') : App.t('cancel')) + '</button>' +
            '<button type="submit" class="btn btn-primary">' + App.t('save') + '</button></div>' +
        '</form>', 'max-w-md'
      );
      document.getElementById('pin-old').focus();
      document.getElementById('pin-cancel').onclick = function () {
        App.closeModal();
        forced ? reject(new Error('cancelled')) : resolve(false);
      };
      document.getElementById('pin-form').onsubmit = function (ev) {
        ev.preventDefault();
        var oldPin = document.getElementById('pin-old').value;
        var newPin = document.getElementById('pin-new').value;
        if (newPin !== document.getElementById('pin-new2').value) { App.toast(App.t('pinMismatch'), 'error'); return; }
        var btn = ev.target.querySelector('button[type=submit]');
        btn.disabled = true;
        App.call('changeMyPin', oldPin, newPin).then(function () {
          App.toast(App.t('pinChanged'), 'success');
          App.closeModal();
          resolve(true);
        }).catch(function (err) {
          btn.disabled = false;
          App.toast(err.message, 'error');
        });
      };
    });
  };
</script>
