<script>
  /** หน้าสาธารณะ: ตรวจสอบความถูกต้องของสลิปเงินเดือน (สแกน QR จากสลิป หรือกรอกรหัส) ไม่ต้องล็อกอิน */
  App.views.verify = function (root) {
    root.innerHTML =
      '<div class="login-bg min-h-screen flex flex-col items-center justify-center p-4">' +
        '<div class="w-full max-w-md">' +
          '<div class="text-center mb-6">' +
            '<img src="' + App.SCHOOL_LOGO + '" alt="ตราโรงเรียนจุนวิทยาคม" class="mx-auto h-16 w-auto mb-3 mix-blend-multiply">' +
            '<div class="text-lg font-bold text-brand-900">ตรวจสอบความถูกต้องของสลิปเงินเดือน</div>' +
            '<div class="text-sm text-gray-500">โรงเรียนจุนวิทยาคม อำเภอจุน จังหวัดพะเยา</div>' +
          '</div>' +
          '<form id="verify-form" class="card p-5 flex gap-2">' +
            '<label for="verify-code" class="sr-only">รหัสตรวจสอบ</label>' +
            '<input id="verify-code" class="input font-mono uppercase" placeholder="CWK-XXXX-XXXX-XXXX" autocapitalize="characters" spellcheck="false" required>' +
            '<button class="btn btn-primary" type="submit">ตรวจสอบ</button>' +
          '</form>' +
          '<div id="verify-result" class="mt-4" aria-live="polite"></div>' +
          '<p class="text-xs text-gray-400 text-center mt-6">ระบบแสดงยอดเงินจากฐานข้อมูลจริงของโรงเรียน หากตัวเลขบนเอกสารที่ได้รับไม่ตรงกับหน้านี้ แสดงว่าเอกสารอาจถูกแก้ไข</p>' +
        '</div>' +
      '</div>';

    var input = document.getElementById('verify-code');
    document.getElementById('verify-form').onsubmit = function (ev) {
      ev.preventDefault();
      check(input.value);
    };
    if (App.config.verifyCode) {
      input.value = App.config.verifyCode;
      check(App.config.verifyCode);
    }

    function check(code) {
      var out = document.getElementById('verify-result');
      out.innerHTML = '<div class="card p-5 text-sm text-gray-400 text-center">กำลังตรวจสอบ...</div>';
      App.api('verifyPayslip', code).then(function (r) {
        if (!r.valid) {
          out.innerHTML = '<div class="card p-5 border-l-4 border-red-600"><div class="font-bold text-red-700">✕ ไม่พบสลิปที่ตรงกับรหัสนี้</div>' +
            '<div class="text-sm text-gray-600 mt-1">รหัสไม่ถูกต้อง หรือสลิปถูกแก้ไข/ยกเลิก กรุณาติดต่อฝ่ายการเงินของโรงเรียน</div></div>';
          return;
        }
        var row = function (k, v) { return '<div class="flex justify-between py-2 border-b border-gray-100 last:border-0 text-sm"><span class="text-gray-500">' + k + '</span><span class="font-semibold text-right">' + v + '</span></div>'; };
        out.innerHTML =
          '<div class="card p-5 border-l-4 border-green-600">' +
            '<div class="font-bold text-green-700">✓ สลิปนี้ออกโดย' + App.esc(r.schoolName) + ' และข้อมูลถูกต้อง</div>' +
            '<div class="text-xs text-gray-500 mb-3">รหัส ' + App.esc(r.code) + '</div>' +
            row('ชื่อ', App.esc(r.name)) +
            row('ตำแหน่ง', App.esc(r.position)) +
            row('ประจำเดือน', App.esc(r.monthLabel)) +
            row('รวมรายรับ', App.money(r.grossPay) + ' บาท') +
            row('รับสุทธิ', App.money(r.netPay) + ' บาท') +
            row('วันที่จ่าย', App.esc(r.paidDateLabel || '-')) +
          '</div>';
      }).catch(function (err) {
        out.innerHTML = '<div class="card p-5 text-sm text-red-700">' + App.esc(err.message) + '</div>';
      });
    }
  };
</script>
