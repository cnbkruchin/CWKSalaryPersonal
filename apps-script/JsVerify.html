<script>
  /** หน้าสาธารณะ: ตรวจสอบความถูกต้องของสลิปเงินเดือน (สแกน QR จากสลิป หรือกรอกรหัส) ไม่ต้องล็อกอิน — ไทย/อังกฤษ */
  App.views.verify = function (root) {
    var lastCode = App.config.verifyCode || '';
    root.innerHTML =
      '<div class="login-bg min-h-screen flex flex-col items-center justify-center p-4">' +
        '<div class="w-full max-w-md">' +
          '<div class="flex justify-end mb-2">' + App.langToggle() + '</div>' +
          '<div class="text-center mb-6">' +
            '<img src="' + App.SCHOOL_LOGO + '" alt="" class="mx-auto h-16 w-auto mb-3 mix-blend-multiply">' +
            '<div class="text-lg font-bold text-brand-900">' + App.t('verifyTitle') + '</div>' +
            '<div class="text-sm text-gray-500">' + App.t('school') + '</div>' +
          '</div>' +
          '<form id="verify-form" class="card p-5 flex gap-2">' +
            '<label for="verify-code" class="sr-only">' + App.t('verifyCode') + '</label>' +
            '<input id="verify-code" class="input font-mono uppercase" placeholder="CWK-XXXX-XXXX-XXXX" autocapitalize="characters" spellcheck="false" required>' +
            '<button class="btn btn-primary" type="submit">' + App.t('verifyBtn') + '</button>' +
          '</form>' +
          '<div id="verify-result" class="mt-4" aria-live="polite"></div>' +
          '<p class="text-xs text-gray-400 text-center mt-6">' + App.t('verifyNote') + '</p>' +
        '</div>' +
      '</div>';

    App.bindLangToggle(root);
    var input = document.getElementById('verify-code');
    document.getElementById('verify-form').onsubmit = function (ev) {
      ev.preventDefault();
      check(input.value);
    };
    if (lastCode) {
      input.value = lastCode;
      check(lastCode);
    }

    function check(code) {
      App.config.verifyCode = code;
      var out = document.getElementById('verify-result');
      out.innerHTML = '<div class="card p-5 text-sm text-gray-400 text-center">' + App.t('verifying') + '</div>';
      App.api('verifyPayslip', code).then(function (r) {
        if (!r.valid) {
          out.innerHTML = '<div class="card p-5 border-l-4 border-red-600"><div class="font-bold text-red-700">' + App.t('verifyInvalid') + '</div>' +
            '<div class="text-sm text-gray-600 mt-1">' + App.t('verifyInvalidText') + '</div></div>';
          return;
        }
        var row = function (k, v) { return '<div class="flex justify-between gap-3 py-2 border-b border-gray-100 last:border-0 text-sm"><span class="text-gray-500">' + k + '</span><span class="font-semibold text-right">' + v + '</span></div>'; };
        out.innerHTML =
          '<div class="card p-5 border-l-4 border-green-600">' +
            '<div class="font-bold text-green-700">' + App.t('verifyValid', { school: App.esc(r.schoolName) }) + '</div>' +
            '<div class="text-xs text-gray-500 mb-3">' + App.t('vCode') + ' ' + App.esc(r.code) + '</div>' +
            row(App.t('vName'), App.esc(r.name)) +
            row(App.t('vPosition'), App.esc(r.position)) +
            row(App.t('vMonth'), App.esc(App.monthName(r.month))) +
            row(App.t('vGross'), App.money(r.grossPay) + ' ' + App.t('baht')) +
            row(App.t('vNet'), App.money(r.netPay) + ' ' + App.t('baht')) +
            row(App.t('vPaid'), App.esc(App.dateShort(r.paidDate) || '-')) +
          '</div>';
      }).catch(function (err) {
        out.innerHTML = '<div class="card p-5 text-sm text-red-700">' + App.esc(err.message) + '</div>';
      });
    }
  };
</script>
