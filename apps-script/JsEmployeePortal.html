<script>
  /**
   * หน้าบ้าน (ลูกจ้าง) — ออกแบบสำหรับมือถือเป็นหลัก: แท็บล่าง 3 เมนู
   * สลิปเงินเดือน | สรุปรายปี | ข้อมูลของฉัน
   */
  App.views.employeePortal = function (root, params) {
    var session = App.session.get();
    var tab = (params && params.tab) || 'slip';
    // ป้องกันผลลัพธ์ที่มาช้าจากแท็บเดิมเขียนทับแท็บที่ผู้ใช้เปลี่ยนไปแล้ว (ประกาศก่อนเรียก switchTab)
    var seq = 0;
    var TABS = [
      { key: 'slip', label: App.t('tabSlip'), icon: 'slip' },
      { key: 'year', label: App.t('tabYear'), icon: 'chart' },
      { key: 'profile', label: App.t('tabProfile'), icon: 'user' }
    ];

    root.innerHTML =
      '<div class="min-h-screen">' +
        '<header class="no-print bg-white border-b border-gray-200 sticky top-0 z-30">' +
          '<div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">' +
            '<img src="' + App.SCHOOL_LOGO + '" alt="" class="h-9 w-auto">' +
            '<div class="flex-1 min-w-0"><div class="font-bold text-brand-900 text-sm leading-tight">' + App.t('appName') + '</div>' +
              '<div class="text-xs text-gray-500 truncate">' + App.esc(session.fullName) + '</div></div>' +
            App.langToggle() +
            '<button id="btn-pin" class="btn btn-ghost !px-2.5" title="' + App.t('changePin') + '" aria-label="' + App.t('changePin') + '"><span class="w-5 h-5">' + App.icon('key') + '</span></button>' +
            '<button id="btn-logout" class="btn btn-ghost !px-2.5" title="' + App.t('logout') + '" aria-label="' + App.t('logout') + '"><span class="w-5 h-5">' + App.icon('logout') + '</span></button>' +
          '</div>' +
          '<nav class="hidden sm:flex max-w-3xl mx-auto px-4 gap-1" aria-label="' + App.t('menu') + '">' +
            TABS.map(function (t) { return '<button data-tab="' + t.key + '" class="tab-top px-3 py-2 text-sm font-semibold border-b-2">' + t.label + '</button>'; }).join('') +
          '</nav>' +
        '</header>' +
        '<main id="portal-main" class="max-w-3xl mx-auto p-4 pb-28 sm:pb-8"></main>' +
        '<nav class="tabbar sm:hidden no-print" aria-label="' + App.t('menu') + '">' +
          TABS.map(function (t) { return '<button data-tab="' + t.key + '"><span>' + App.icon(t.icon) + '</span>' + t.label + '</button>'; }).join('') +
        '</nav>' +
      '</div>';

    document.getElementById('btn-pin').onclick = function () { App.showChangePinModal(false); };
    document.getElementById('btn-logout').onclick = function () { App.logout(); };
    App.bindLangToggle(root);
    root.querySelectorAll('[data-tab]').forEach(function (b) {
      b.onclick = function () { switchTab(b.getAttribute('data-tab')); };
    });
    switchTab(tab);

    function current(mySeq) { return mySeq === seq && document.getElementById('portal-main'); }

    function switchTab(key) {
      tab = key;
      seq++;
      // จำแท็บไว้ใน URL (ไม่ทำให้ render ซ้ำ) — สลับภาษา/รีเฟรชแล้วยังอยู่แท็บเดิม
      try { history.replaceState(null, '', '#/me?tab=' + key); } catch (e) {}
      root.querySelectorAll('.tabbar [data-tab]').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === key); });
      root.querySelectorAll('.tab-top').forEach(function (b) {
        var on = b.getAttribute('data-tab') === key;
        b.className = 'tab-top px-3 py-2 text-sm font-semibold border-b-2 ' + (on ? 'border-brand-600 text-brand-700' : 'border-transparent text-gray-500 hover:text-gray-700');
      });
      var main = document.getElementById('portal-main');
      main.innerHTML = '<div class="text-gray-400 text-sm py-10 text-center">' + App.t('loading') + '</div>';
      if (key === 'slip') renderSlipTab(main);
      else if (key === 'year') renderYearTab(main);
      else renderProfileTab(main);
    }

    // ------------------------- แท็บสลิปเงินเดือน -------------------------
    function renderSlipTab(main) {
      var mySeq = seq;
      App.call('listMyPayslipMonths').then(function (months) {
        if (!current(mySeq)) return;
        if (!months.length) {
          main.innerHTML = emptyState(App.t('emptySlip'), App.t('emptySlipText'));
          return;
        }
        var want = (params && params.month) || App.currentMonthKey();
        var selected = months.some(function (m) { return m.month === want; }) ? want : months[0].month;

        main.innerHTML =
          '<div id="slip-hero"></div>' +
          '<div class="flex items-center justify-between gap-3 mt-5 mb-3">' +
            '<label class="label !mb-0" for="month-select">' + App.t('chooseMonth') + '</label>' +
            '<select id="month-select" class="input max-w-[14rem]">' +
              months.map(function (m) { return '<option value="' + m.month + '">' + App.esc(App.monthName(m.month)) + '</option>'; }).join('') +
            '</select>' +
          '</div>' +
          '<div id="slip-preview" class="slip-fit card p-0 overflow-hidden"></div>' +
          '<h2 class="font-semibold text-sm text-gray-500 mt-8 mb-2">' + App.t('history') + '</h2>' +
          '<div class="card divide-y divide-gray-100">' +
            months.map(function (m) {
              return '<button data-m="' + m.month + '" class="hist-row w-full flex items-center justify-between px-4 py-3 text-left hover:bg-gray-50">' +
                '<span><span class="font-medium">' + App.esc(App.monthName(m.month)) + '</span>' +
                (m.paidDate ? '<span class="block text-xs text-gray-400">' + App.t('paidOn', { d: App.dateShort(m.paidDate) }) + '</span>' : '') + '</span>' +
                '<span class="font-semibold tabular-nums">' + App.money(m.netPay) + ' ' + App.t('baht') + '</span></button>';
            }).join('') +
          '</div>';

        var sel = document.getElementById('month-select');
        sel.value = selected;
        sel.onchange = function () { loadSlip(sel.value); };
        main.querySelectorAll('.hist-row').forEach(function (b) {
          b.onclick = function () {
            sel.value = b.getAttribute('data-m');
            loadSlip(sel.value);
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };
        });
        loadSlip(selected);
      }).catch(function (err) { main.innerHTML = emptyState(App.t('loadFail'), err.message); });
    }

    function loadSlip(month) {
      var mySeq = seq;
      try { history.replaceState(null, '', '#/me?tab=slip&month=' + month); } catch (e) {}
      var preview = document.getElementById('slip-preview');
      preview.innerHTML = '<div class="text-gray-400 text-sm p-8 text-center">' + App.t('loading') + '</div>';
      App.call('getMyPayslip', month).then(function (slip) {
        if (!current(mySeq) || !document.getElementById('slip-hero')) return;
        document.getElementById('slip-hero').innerHTML =
          '<div class="hero-net p-5">' +
            '<div class="text-sm opacity-80">' + App.t('netPayFor', { m: App.esc(App.monthName(slip.month)) }) + '</div>' +
            '<div class="text-4xl font-bold mt-1 tabular-nums">' + App.money(slip.netPay) + ' <span class="text-lg font-semibold opacity-80">' + App.t('baht') + '</span></div>' +
            '<div class="text-xs opacity-80 mt-1">' + App.esc(App.lang === 'en' ? App.bahtTextEn(slip.netPay) : slip.netPayText) + '</div>' +
            (slip.paidDate ? '<div class="text-xs opacity-80">' + App.t('paidOn', { d: App.dateShort(slip.paidDate) }) + '</div>' : '') +
            '<div class="grid grid-cols-2 gap-3 mt-4 text-sm">' +
              '<div class="bg-white/10 rounded-xl px-3 py-2"><div class="opacity-80 text-xs">' + App.t('totalEarnings') + '</div><div class="font-semibold tabular-nums">' + App.money(slip.grossPay) + '</div></div>' +
              '<div class="bg-white/10 rounded-xl px-3 py-2"><div class="opacity-80 text-xs">' + App.t('totalDeductions') + '</div><div class="font-semibold tabular-nums">' + App.money(slip.totalDeduction) + '</div></div>' +
            '</div>' +
            '<button id="btn-print-my" class="btn btn-lg w-full justify-center mt-4 bg-white text-brand-700 hover:bg-brand-50">' +
              '<span class="w-5 h-5">' + App.icon('print') + '</span> ' + App.t('printPdf') + '</button>' +
          '</div>';
        document.getElementById('btn-print-my').onclick = function () {
          App.showPrintView([slip], App.t('slipTitle', { m: App.monthName(slip.month) }), '/me?tab=slip&month=' + month);
        };
        document.getElementById('slip-preview').innerHTML = App.renderPayslip(slip);
        App.fitSlips(document.getElementById('portal-main'));
      }).catch(function (err) {
        preview.innerHTML = '<div class="text-gray-500 text-sm p-8 text-center">' + App.esc(err.message) + '</div>';
      });
    }

    // ------------------------- แท็บสรุปรายปี -------------------------
    function renderYearTab(main, year) {
      var mySeq = seq;
      App.call('getMyAnnualSummary', year || null).then(function (d) {
        if (!current(mySeq)) return;
        if (!d.years.length) {
          main.innerHTML = emptyState(App.t('emptyYear'), App.t('emptyYearText'));
          return;
        }
        main.innerHTML =
          '<div class="flex items-center justify-between gap-3 mb-4">' +
            '<h1 class="text-lg font-bold">' + App.t('yearTitle', { y: App.lang === 'en' ? d.year : d.yearBE }) + '</h1>' +
            '<select id="year-select" class="input max-w-[9rem]">' +
              d.years.map(function (y) { return '<option value="' + y.year + '"' + (y.year === d.year ? ' selected' : '') + '>' + App.t('yearOpt', { be: y.yearBE, ce: y.year }) + '</option>'; }).join('') +
            '</select>' +
          '</div>' +
          '<div class="grid grid-cols-1 sm:grid-cols-3 gap-3">' +
            tile(App.t('tileGross'), d.totals.grossPay, App.t('tileGrossNote')) +
            tile(App.t('tileSso'), d.totals.ssoEmployee, App.t('tileSsoNote')) +
            tile(App.t('tileNet'), d.totals.netPay, App.t('monthsCount', { n: d.rows.length })) +
          '</div>' +
          '<div class="card overflow-x-auto mt-4"><table class="table-clean w-full">' +
            '<thead><tr><th>' + App.t('colMonth') + '</th><th class="text-right">' + App.t('colGross') + '</th><th class="text-right">' + App.t('colSso') + '</th><th class="text-right">' + App.t('colNet') + '</th></tr></thead><tbody>' +
            d.rows.map(function (r) {
              return '<tr><td>' + App.esc(App.monthName(r.month)) + '</td><td class="text-right tabular-nums">' + App.money(r.grossPay) + '</td>' +
                '<td class="text-right tabular-nums">' + App.money(r.ssoEmployee) + '</td><td class="text-right tabular-nums font-semibold">' + App.money(r.netPay) + '</td></tr>';
            }).join('') +
            '</tbody></table></div>' +
          '<button id="btn-print-year" class="btn btn-primary btn-lg w-full sm:w-auto justify-center mt-4"><span class="w-5 h-5">' + App.icon('print') + '</span> ' + App.t('printYear') + '</button>' +
          '<p class="text-xs text-gray-400 mt-3">' + App.t('yearHint') + '</p>';

        document.getElementById('year-select').onchange = function () { renderYearTab(main, this.value); };
        document.getElementById('btn-print-year').onclick = function () {
          App.showDocPrint(App.renderAnnualSummary(d), App.t('yearDocTitle', { y: App.lang === 'en' ? d.year : d.yearBE }), '/me?tab=year');
        };
      }).catch(function (err) { main.innerHTML = emptyState(App.t('loadFail'), err.message); });
    }

    function tile(caption, value, note) {
      return '<div class="card p-4 stat-tile"><div class="caption">' + caption + '</div>' +
        '<div class="value">' + App.money(value) + '</div><div class="text-xs text-gray-400">' + note + '</div></div>';
    }

    // ------------------------- แท็บข้อมูลของฉัน -------------------------
    function renderProfileTab(main) {
      var mySeq = seq;
      App.call('getMyProfile').then(function (p) {
        if (!current(mySeq)) return;
        var row = function (k, v) {
          return '<div class="flex justify-between gap-4 py-2.5 border-b border-gray-100 last:border-0"><span class="text-gray-500 text-sm">' + k + '</span>' +
            '<span class="text-sm font-medium text-right">' + (v || '-') + '</span></div>';
        };
        main.innerHTML =
          '<div class="card p-5">' +
            '<div class="text-lg font-bold">' + App.esc(p.fullName) + '</div>' +
            '<div class="text-sm text-gray-500">' + App.esc(p.position || p.group || '') + '</div>' +
            '<div class="mt-3">' +
              row(App.t('employeeId'), App.esc(p.employeeId)) +
              row(App.t('group'), App.esc(p.group)) +
              row(App.t('startDate'), App.esc(App.dateShort(p.startDate))) +
              row(App.t('sso'), p.hasSSO ? App.t('ssoYes') : App.t('ssoNo')) +
              row(App.t('citizenId'), '<span class="font-mono">' + App.esc(p.citizenIdMasked) + '</span>') +
            '</div>' +
          '</div>' +
          '<div class="card p-5 mt-4"><h2 class="font-semibold mb-1">' + App.t('bankTitle') + '</h2>' +
            row(App.t('bank'), App.esc(p.bankName)) +
            row(App.t('accountNo'), '<span class="font-mono">' + App.esc(p.bankAccountMasked) + '</span>') +
          '</div>' +
          (p.salaryHistory.length
            ? '<div class="card p-5 mt-4"><h2 class="font-semibold mb-3">' + App.t('salaryHistory') + '</h2><ol class="relative border-l-2 border-brand-100 ml-2 space-y-4">' +
                p.salaryHistory.map(function (h) {
                  return '<li class="ml-4"><span class="absolute -left-[7px] mt-1.5 w-3 h-3 rounded-full bg-brand-500"></span>' +
                    '<div class="text-sm font-semibold">' + App.money(h.baseSalary) + ' ' + App.t('baht') + ' <span class="text-gray-400 font-normal">· ' + App.esc(h.changeType) + '</span></div>' +
                    '<div class="text-xs text-gray-500">' + App.t('effective', { m: App.esc(App.monthName(h.effectiveMonth)) }) + '</div></li>';
                }).join('') + '</ol></div>'
            : '') +
          '<div class="card p-5 mt-4"><h2 class="font-semibold mb-1">' + App.t('security') + '</h2>' +
            row(App.t('lastLogin'), App.esc(App.dateTime(p.lastLoginAt))) +
            '<button id="btn-pin2" class="btn btn-secondary w-full justify-center mt-3"><span class="w-4 h-4">' + App.icon('key') + '</span> ' + App.t('changePin') + '</button>' +
          '</div>' +
          '<p class="text-xs text-gray-400 mt-4 text-center">' + App.t('wrongInfo') + '</p>';
        document.getElementById('btn-pin2').onclick = function () { App.showChangePinModal(false); };
      }).catch(function (err) { main.innerHTML = emptyState(App.t('loadFail'), err.message); });
    }

    function emptyState(title, text) {
      return '<div class="card p-10 text-center"><div class="w-10 h-10 mx-auto text-gray-300 mb-3">' + App.icon('slip') + '</div>' +
        '<div class="font-semibold text-gray-700">' + App.esc(title) + '</div><div class="text-sm text-gray-500 mt-1">' + App.esc(text) + '</div></div>';
    }
  };

  /** เอกสารสรุปรายได้ประจำปี (A4 แนวตั้ง) — หัวข้อ 2 ภาษา ใช้ได้ทั้งยื่นภาษีและยื่นเอกสารต่างประเทศ */
  App.renderAnnualSummary = function (d) {
    var en = function (t) { return '<br><span style="font-size:.75em;color:#555;font-weight:400">' + t + '</span>'; };
    var heads = [['เดือน', 'Month'], ['เงินเดือน', 'Salary'], ['รายรับอื่น', 'Other income'], ['รวมรายรับ', 'Gross pay'],
      ['ประกันสังคม', 'Social security'], ['หักอื่น', 'Other deductions'], ['สุทธิ', 'Net pay']];
    return '<div style="font-family:Sarabun,sans-serif;max-width:190mm;margin:0 auto" class="text-[14px] leading-relaxed">' +
      '<div class="flex items-center gap-4 border-b-2 border-brand-600 pb-3 mb-4">' +
        '<img src="' + App.SCHOOL_LOGO + '" alt="" style="height:60px">' +
        '<div><div class="text-lg font-bold">' + App.esc(d.schoolName) + '</div><div class="text-sm text-gray-600">' + App.esc(d.schoolAddress) + '</div></div>' +
      '</div>' +
      '<div class="text-center font-bold text-base mb-4">สรุปรายได้ค่าจ้างประจำปี พ.ศ. ' + d.yearBE + en('Annual Income Statement ' + d.year) + '</div>' +
      '<p>ชื่อ-สกุล / Name: <b>' + App.esc(d.fullName) + '</b> &nbsp; รหัสพนักงาน / Employee ID: ' + App.esc(d.employeeId) + '<br>ตำแหน่ง / Position: ' + App.esc(d.position) + '</p>' +
      '<table class="w-full mt-3" style="border-collapse:collapse">' +
        '<thead><tr>' + heads.map(function (h, i) {
          return '<th class="border border-gray-700 p-1.5 ' + (i ? 'text-right' : '') + '">' + h[0] + en(h[1]) + '</th>';
        }).join('') + '</tr></thead><tbody>' +
        d.rows.map(function (r) {
          return '<tr><td class="border border-gray-700 p-1.5">' + App.esc(App.monthName(r.month, 'th')) + ' <span style="color:#666;font-size:.8em">' + App.esc(App.monthName(r.month, 'en')) + '</span></td>' +
            [r.baseSalary, r.otherIncome, r.grossPay, r.ssoEmployee, r.otherDeduction, r.netPay].map(function (v) {
              return '<td class="border border-gray-700 p-1.5 text-right">' + App.money(v) + '</td>';
            }).join('') + '</tr>';
        }).join('') +
        '<tr class="font-bold"><td class="border border-gray-700 p-1.5">รวมทั้งปี / Total</td>' +
          [d.totals.baseSalary, d.totals.otherIncome, d.totals.grossPay, d.totals.ssoEmployee, d.totals.otherDeduction, d.totals.netPay].map(function (v) {
            return '<td class="border border-gray-700 p-1.5 text-right">' + App.money(v) + '</td>';
          }).join('') + '</tr>' +
      '</tbody></table>' +
      '<p class="mt-3">รวมรายได้ทั้งปี ' + App.money(d.totals.grossPay) + ' บาท (' + App.esc(d.grossText) + ')<br>' +
        '<span style="color:#555">Total gross income: THB ' + App.money(d.totals.grossPay) + ' (' + App.esc(App.bahtTextEn(d.totals.grossPay)) + ')</span></p>' +
      '<p class="text-xs text-gray-500 mt-1">* จัดทำจากข้อมูลสลิปเงินเดือนที่ได้รับอนุมัติในระบบ ณ วันที่พิมพ์ ' + new Date().toLocaleDateString('th-TH', { dateStyle: 'long' }) +
        ' / Generated from approved payroll records on ' + new Date().toLocaleDateString('en-GB', { dateStyle: 'long' }) + '</p>' +
      '<div class="flex justify-end mt-12"><div class="text-center">ลงชื่อ.................................................<br>' +
        '(' + App.esc(d.financeOfficerName || '.................................') + ')<br>' + App.esc(d.financeOfficerTitle || 'เจ้าหน้าที่การเงิน') + en('Finance Officer') + '</div></div>' +
    '</div>';
  };
</script>
