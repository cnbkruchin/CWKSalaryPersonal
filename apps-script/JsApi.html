  /** จำนวนเงินเป็นตัวหนังสือภาษาไทย (ตรงกับ bahtText ฝั่งเซิร์ฟเวอร์) */
  App.bahtText = function (amount) {
    var NUM = ['ศูนย์', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
    var UNIT = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
    function read(n) {
      var s = String(n), out = '';
      if (s.length > 6) return read(s.slice(0, -6)) + 'ล้าน' + (Number(s.slice(-6)) ? read(Number(s.slice(-6))) : '');
      for (var i = 0; i < s.length; i++) {
        var d = +s[i], pos = s.length - i - 1;
        if (!d) continue;
        if (pos === 0 && d === 1 && s.length > 1) out += 'เอ็ด';
        else if (pos === 1 && d === 1) out += 'สิบ';
        else if (pos === 1 && d === 2) out += 'ยี่สิบ';
        else out += NUM[d] + UNIT[pos];
      }
      return out;
    }
    amount = Math.round((Number(amount) || 0) * 100) / 100;
    var neg = amount < 0; amount = Math.abs(amount);
    var baht = Math.floor(amount), satang = Math.round((amount - baht) * 100);
    var text = (baht ? read(baht) : 'ศูนย์') + 'บาท' + (satang ? read(satang) + 'สตางค์' : 'ถ้วน');
    return (neg ? 'ลบ' : '') + text;
  };

  /** จำนวนเงินเป็นคำอ่านภาษาอังกฤษ เช่น "Twelve Thousand Fifty Baht Only" */
  App.bahtTextEn = function (amount) {
    var ONES = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
    var TENS = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
    function under1000(n) {
      var w = [];
      if (n >= 100) { w.push(ONES[Math.floor(n / 100)] + ' Hundred'); n %= 100; }
      if (n >= 20) { w.push(TENS[Math.floor(n / 10)] + (n % 10 ? '-' + ONES[n % 10] : '')); } else if (n) { w.push(ONES[n]); }
      return w.join(' ');
    }
    function words(n) {
      if (!n) return 'Zero';
      var scales = [[1e9, 'Billion'], [1e6, 'Million'], [1e3, 'Thousand']], out = [];
      scales.forEach(function (sc) { if (n >= sc[0]) { out.push(under1000(Math.floor(n / sc[0])) + ' ' + sc[1]); n %= sc[0]; } });
      if (n) out.push(under1000(n));
      return out.join(' ');
    }
    amount = Math.round((Number(amount) || 0) * 100) / 100;
    var baht = Math.floor(Math.abs(amount)), satang = Math.round((Math.abs(amount) - baht) * 100);
    return (amount < 0 ? 'Minus ' : '') + words(baht) + ' Baht' + (satang ? ' and ' + words(satang) + ' Satang' : ' Only');
  };

  /** จำนวนเงินสำหรับเอกสาร: ไม่มีทศนิยมถ้าเป็นจำนวนเต็ม, ศูนย์แสดง "-" แบบบัญชี */
  App.amt = function (n, zeroDash) {
    n = Math.round((Number(n) || 0) * 100) / 100;
    if (!n && zeroDash !== false) return '-';
    return n.toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
  };

  App.config = window.APP_CONFIG || { mode: 'employee', verifyCode: '', appUrl: '' };

  /** เก็บ session แยกตามทางเข้า (หน้าบ้าน/หลังบ้าน) เพื่อไม่ให้ชนกันเมื่อเปิดทั้งสองแบบในเครื่องเดียว */
  App.session = (function () {
    var KEY = 'cwk_session_' + App.config.mode;
    return {
      get: function () {
        try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; }
      },
      set: function (s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} },
      clear: function () { try { localStorage.removeItem(KEY); } catch (e) {} }
    };
  })();

  App.store = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    remove: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  /** เรียกฟังก์ชันฝั่งเซิร์ฟเวอร์ (*.gs) แบบ Promise ทุกฟังก์ชันคืน {ok,data|error} */
  App.api = function (fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        reject(new Error('ใช้งานได้เฉพาะเมื่อรันบน Google Apps Script Web App เท่านั้น'));
        return;
      }
      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.ok === false) reject(new Error(App.tErr ? App.tErr(res.error || 'เกิดข้อผิดพลาด') : res.error));
          else resolve(res && res.hasOwnProperty('data') ? res.data : res);
        })
        .withFailureHandler(function (err) {
          var msg = err && err.message ? err.message : 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาลองใหม่';
          reject(new Error(App.tErr ? App.tErr(msg) : msg));
        })[fnName].apply(null, args);
    });
  };

  /** เรียก API ที่ต้องแนบ token เซสชันปัจจุบันเป็นอาร์กิวเมนต์แรกเสมอ */
  App.call = function (fnName) {
    var session = App.session.get();
    var token = session ? session.token : '';
    var args = [fnName, token].concat(Array.prototype.slice.call(arguments, 1));
    return App.api.apply(null, args).catch(function (err) {
      if (/เซสชันหมดอายุ|กรุณาเข้าสู่ระบบ|session has expired/.test(err.message)) {
        App.session.clear();
        App.toast(err.message, 'info');
        App.router.go('/login');
      }
      throw err;
    });
  };

  // ---------------- Toast ----------------
  App.toast = function (message, type) {
    var wrap = document.getElementById('toast-wrap');
    var el = document.createElement('div');
    el.className = 'toast toast-' + (type || 'info');
    el.textContent = message;
    wrap.appendChild(el);
    setTimeout(function () {
      el.style.transition = 'opacity .3s';
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    }, type === 'error' ? 4500 : 3200);
  };

  // ---------------- Modal ----------------
  App.closeModal = function () { document.getElementById('modal-root').innerHTML = ''; };

  App.modalHtml = function (innerHtml, widthClass) {
    var root = document.getElementById('modal-root');
    root.innerHTML = '<div class="modal-backdrop"><div class="card p-6 w-full ' + (widthClass || 'max-w-lg') +
      ' max-h-[90vh] overflow-y-auto" role="dialog" aria-modal="true">' + innerHtml + '</div></div>';
  };

  App.confirm = function (message, okLabel, danger) {
    return new Promise(function (resolve) {
      App.modalHtml(
        '<p class="text-sm text-gray-700 mb-5">' + App.esc(message) + '</p>' +
        '<div class="flex justify-end gap-2">' +
        '<button id="modal-cancel" class="btn btn-secondary">ยกเลิก</button>' +
        '<button id="modal-ok" class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '">' + App.esc(okLabel || 'ยืนยัน') + '</button>' +
        '</div>', 'max-w-sm');
      document.getElementById('modal-cancel').onclick = function () { App.closeModal(); resolve(false); };
      document.getElementById('modal-ok').onclick = function () { App.closeModal(); resolve(true); };
      document.getElementById('modal-ok').focus();
    });
  };

  /** กล่องให้กรอกข้อความ คืน Promise<string|null> */
  App.prompt = function (message, placeholder, okLabel) {
    return new Promise(function (resolve) {
      App.modalHtml(
        '<form id="prompt-form"><p class="text-sm text-gray-700 mb-3">' + App.esc(message) + '</p>' +
        '<input id="prompt-input" class="input mb-5" placeholder="' + App.esc(placeholder || '') + '" required>' +
        '<div class="flex justify-end gap-2">' +
        '<button type="button" id="prompt-cancel" class="btn btn-secondary">ยกเลิก</button>' +
        '<button type="submit" class="btn btn-primary">' + App.esc(okLabel || 'ตกลง') + '</button></div></form>', 'max-w-sm');
      var input = document.getElementById('prompt-input');
      input.focus();
      document.getElementById('prompt-cancel').onclick = function () { App.closeModal(); resolve(null); };
      document.getElementById('prompt-form').onsubmit = function (ev) {
        ev.preventDefault();
        App.closeModal();
        resolve(input.value.trim());
      };
    });
  };

  /** กล่องเลือกวันที่ คืน Promise<'YYYY-MM-DD'|null> */
  App.pickDate = function (title, message, value, okLabel) {
    return new Promise(function (resolve) {
      App.modalHtml(
        '<form id="date-form"><h3 class="text-lg font-bold mb-1">' + App.esc(title) + '</h3>' +
        '<p class="text-sm text-gray-600 mb-3">' + App.esc(message) + '</p>' +
        '<label class="label" for="date-input">วันที่จ่ายเงินเดือน</label>' +
        '<input id="date-input" type="date" class="input mb-5" required value="' + App.esc(value || '') + '">' +
        '<div class="flex justify-end gap-2">' +
        '<button type="button" id="date-cancel" class="btn btn-secondary">ยกเลิก</button>' +
        '<button type="submit" class="btn btn-primary">' + App.esc(okLabel || 'ตกลง') + '</button></div></form>', 'max-w-sm');
      document.getElementById('date-cancel').onclick = function () { App.closeModal(); resolve(null); };
      document.getElementById('date-form').onsubmit = function (ev) {
        ev.preventDefault();
        var v = document.getElementById('date-input').value;
        App.closeModal();
        resolve(v || null);
      };
    });
  };

  /** ดาวน์โหลดไฟล์ข้อความ (เช่น CSV) — ใส่ BOM ให้ Excel อ่านภาษาไทยถูกต้อง */
  App.downloadText = function (filename, text, mime) {
    var blob = new Blob(['﻿' + text], { type: (mime || 'text/csv') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  };

  App.csv = function (rows) {
    return rows.map(function (r) {
      return r.map(function (v) {
        var s = String(v === undefined || v === null ? '' : v);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\r\n');
  };

  // ---------------- Formatting helpers ----------------
  App.esc = function (s) {
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };

  App.money = function (n) {
    n = Number(n) || 0;
    return n.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  };

  App.money0 = function (n) {
    return (Number(n) || 0).toLocaleString('th-TH', { maximumFractionDigits: 0 });
  };

  App.THAI_MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

  App.currentMonthKey = function () {
    var d = new Date();
    var m = d.getMonth() + 1;
    return d.getFullYear() + '-' + (m < 10 ? '0' + m : m);
  };

  App.monthLabel = function (key) {
    var p = String(key).split('-');
    return App.THAI_MONTHS[parseInt(p[1], 10) - 1] + ' ' + (parseInt(p[0], 10) + 543);
  };

  App.monthOptions = function (centerMonth, before, after) {
    var out = [];
    var y = parseInt(centerMonth.split('-')[0], 10);
    var m = parseInt(centerMonth.split('-')[1], 10);
    for (var i = -before; i <= after; i++) {
      var d = new Date(Date.UTC(y, m - 1 + i, 1));
      var yy = d.getUTCFullYear(), mm = d.getUTCMonth() + 1;
      var key = yy + '-' + (mm < 10 ? '0' + mm : mm);
      out.push({ key: key, label: App.THAI_MONTHS[mm - 1] + ' ' + (yy + 543) });
    }
    return out;
  };

  /** "2026-09-25T10:15:00" -> "25 ก.ย. 69 10:15" */
  App.dateTime = function (iso) {
    if (!iso) return '-';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' });
  };

  App.icon = function (name) {
    var paths = {
      slip: 'M7 3h10a2 2 0 0 1 2 2v16l-3-2-2 2-2-2-2 2-2-2-3 2V5a2 2 0 0 1 2-2zm2 5h6M9 12h6M9 16h4',
      chart: 'M4 20V10m6 10V4m6 16v-7m4 7H2',
      user: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-7 9a7 7 0 0 1 14 0',
      logout: 'M15 17l5-5-5-5M20 12H9M12 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7',
      key: 'M15 7a4 4 0 1 1-3.9 5H3v3h3v3h3v-3h2.1A4 4 0 0 1 15 7z',
      menu: 'M4 6h16M4 12h16M4 18h16',
      print: 'M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z',
      shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zm-3 9l2 2 4-4'
    };
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + paths[name] + '"/></svg>';
  };
</script>
