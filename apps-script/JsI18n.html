  /** ข้อความตามภาษาปัจจุบัน แทน {ตัวแปร} ด้วยค่าใน vars */
  App.t = function (key, vars) {
    var pair = I18N[key];
    var s = pair ? pair[App.lang === 'en' ? 1 : 0] : key;
    if (vars) Object.keys(vars).forEach(function (k) { s = s.split('{' + k + '}').join(vars[k]); });
    return s;
  };

  var EN_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var EN_MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var TH_MONTHS_SHORT = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

  /** "2026-09" -> "กันยายน 2569" / "September 2026" */
  App.monthName = function (key, lang) {
    var p = String(key || '').split('-');
    if (p.length < 2) return '';
    var y = parseInt(p[0], 10), m = parseInt(p[1], 10) - 1;
    return (lang || App.lang) === 'en' ? EN_MONTHS[m] + ' ' + y : App.THAI_MONTHS[m] + ' ' + (y + 543);
  };

  /** "2026-09-30" -> "30 ก.ย. 2569" / "30 Sep 2026" */
  App.dateShort = function (key, lang) {
    var p = String(key || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!p) return '';
    var y = +p[1], m = +p[2] - 1, d = +p[3];
    return (lang || App.lang) === 'en' ? d + ' ' + EN_MONTHS_SHORT[m] + ' ' + y : d + ' ' + TH_MONTHS_SHORT[m] + ' ' + (y + 543);
  };

  /** แปลข้อความ error จากเซิร์ฟเวอร์ (ภาษาไทย) ที่ลูกจ้างอาจเห็น เป็นภาษาอังกฤษ */
  var ERROR_EN = [
    [/รหัสพนักงานหรือรหัสผ่านไม่ถูกต้อง(?:.*เหลืออีก (\d) ครั้ง)?/, function (m) { return 'Incorrect employee ID or PIN' + (m[1] ? ' (' + m[1] + ' attempt(s) left before lock-out)' : ''); }],
    [/ล็อก/, 'Too many wrong attempts — your account is locked for 15 minutes. The finance office can unlock it.'],
    [/บัญชีผู้ดูแลระบบ/, 'This is an administrator account. Please use the staff sign-in page.'],
    [/PIN ต้องเป็นตัวเลข 6 หลัก/, 'PIN must be exactly 6 digits'],
    [/เรียงกัน/, 'PIN must not be a sequence such as 123456'],
    [/ซ้ำกันทั้งหมด/, 'PIN must not repeat one digit (e.g. 111111)'],
    [/เลขบัตรประชาชน/, 'PIN must not match the last 6 digits of your national ID'],
    [/ไม่ซ้ำกับรหัสเดิม/, 'The new PIN must differ from your current PIN'],
    [/รหัสผ่านเดิมไม่ถูกต้อง/, 'Your current PIN is incorrect'],
    [/เซสชันหมดอายุ|กรุณาเข้าสู่ระบบ/, 'Your session has expired. Please sign in again.'],
    [/ยังไม่มีสลิป/, 'There is no approved payslip for this month yet'],
    [/เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ/, 'Could not reach the server. Please try again.']
  ];
  App.tErr = function (msg) {
    if (App.lang !== 'en') return msg;
    for (var i = 0; i < ERROR_EN.length; i++) {
      var m = String(msg).match(ERROR_EN[i][0]);
      if (m) return typeof ERROR_EN[i][1] === 'function' ? ERROR_EN[i][1](m) : ERROR_EN[i][1];
    }
    return msg;
  };

  /** ปุ่มสลับภาษา TH | EN */
  App.langToggle = function () {
    return '<div class="inline-flex rounded-lg border border-gray-200 bg-white overflow-hidden text-xs font-semibold" role="group" aria-label="Language">' +
      ['th', 'en'].map(function (l) {
        return '<button type="button" data-lang="' + l + '" class="lang-btn px-2.5 py-1 ' + (App.lang === l ? 'bg-brand-600 text-white' : 'text-gray-600 hover:bg-gray-50') + '"' +
          (App.lang === l ? ' aria-pressed="true"' : '') + '>' + l.toUpperCase() + '</button>';
      }).join('') + '</div>';
  };
  App.bindLangToggle = function (root) {
    (root || document).querySelectorAll('.lang-btn').forEach(function (b) {
      b.onclick = function () { if (b.getAttribute('data-lang') !== App.lang) App.setLang(b.getAttribute('data-lang')); };
    });
  };
