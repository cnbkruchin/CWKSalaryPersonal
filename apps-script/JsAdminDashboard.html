<script>
  App.views.adminDashboard = function (root) {
    root.innerHTML = App.adminShell('dashboard', '<div id="dash-body" class="p-4 sm:p-6"><p class="text-gray-400">กำลังโหลด...</p></div>');

    App.call('getAdminDashboard').then(render).catch(function (err) {
      document.getElementById('dash-body').innerHTML = '<div class="card p-6 text-red-700">' + App.esc(err.message) + '</div>';
    });

    function render(d) {
      var run = d.currentRun;
      var runStatus = !run ? '<span class="badge bg-gray-100 text-gray-600">ยังไม่สร้าง</span>'
        : (run.status === 'approved' ? '<span class="badge badge-approved">✓ อนุมัติแล้ว</span>' : '<span class="badge badge-draft">● แบบร่าง</span>');

      var checklist = [
        { ok: !!run, text: 'สร้างรอบจ่ายเดือน' + d.currentMonthLabel, link: '/admin/payroll' },
        { ok: d.pendingBackPay.count === 0, text: d.pendingBackPay.count ? ('มีตกเบิกค้างจ่าย ' + d.pendingBackPay.count + ' รายการ') : 'ไม่มีตกเบิกค้างจ่าย', link: '/admin/salary' },
        { ok: !!run && run.status === 'approved', text: 'อนุมัติรอบจ่ายให้ลูกจ้างเห็นสลิป', link: '/admin/payroll' },
        { ok: d.accounts.mustChangePin === 0, text: d.accounts.mustChangePin ? ('ลูกจ้าง ' + d.accounts.mustChangePin + ' คนยังใช้รหัสชั่วคราว') : 'ลูกจ้างทุกคนตั้ง PIN ของตัวเองแล้ว', link: '/admin/employees' }
      ];

      document.getElementById('dash-body').innerHTML =
        '<div class="flex items-center justify-between flex-wrap gap-2 mb-4">' +
          '<div><div class="text-sm text-gray-500">เดือนปัจจุบัน</div><h1 class="text-xl font-bold">' + App.esc(d.currentMonthLabel) + ' ' + runStatus + '</h1></div>' +
          '<a href="#/admin/payroll" class="btn btn-primary">ไปที่รอบจ่ายเดือนนี้ →</a>' +
        '</div>' +

        '<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">' +
          tile('ยอดโอนสุทธิเดือนนี้', run ? App.money(run.netPay) : '—', run ? (run.headcount + ' คน · รวมรับ ' + App.money0(run.grossPay)) : 'ยังไม่มีรอบจ่าย') +
          tile('ลูกจ้างที่ใช้งาน', d.activeEmployees + ' คน', 'ผู้ประกันตน ปกส. ' + d.ssoEmployees + ' คน') +
          tile('ตกเบิกค้างจ่าย', App.money(d.pendingBackPay.total), d.pendingBackPay.count + ' รายการ') +
          tile('ยังไม่เคยเข้าใช้ระบบ', d.accounts.neverLoggedIn + ' คน', 'ยอมรับ PDPA แล้ว ' + d.accounts.pdpaAccepted + '/' + d.activeEmployees + ' คน') +
        '</div>' +

        '<div class="grid lg:grid-cols-3 gap-4 mt-4">' +
          '<div class="card p-5 lg:col-span-2">' +
            '<h2 class="font-semibold">ยอดโอนสุทธิ 6 เดือนล่าสุด (บาท)</h2>' +
            (d.trend.length ? '<div id="trend-chart" class="relative mt-3"></div>' +
              '<details class="mt-2 text-sm"><summary class="cursor-pointer text-gray-500">ดูเป็นตาราง</summary>' +
              '<table class="table-clean w-full mt-2"><thead><tr><th>เดือน</th><th class="text-right">คน</th><th class="text-right">สุทธิ</th><th>สถานะ</th></tr></thead><tbody>' +
              d.trend.map(function (t) {
                return '<tr><td>' + App.esc(t.monthLabel) + '</td><td class="text-right">' + t.headcount + '</td><td class="text-right tabular-nums">' + App.money(t.netPay) + '</td><td>' + (t.status === 'approved' ? 'อนุมัติแล้ว' : 'ร่าง') + '</td></tr>';
              }).join('') + '</tbody></table></details>'
              : '<p class="text-sm text-gray-400 mt-6">ยังไม่มีข้อมูลรอบจ่าย</p>') +
          '</div>' +
          '<div class="card p-5">' +
            '<h2 class="font-semibold mb-3">ความพร้อมเดือนนี้</h2>' +
            '<ul class="space-y-2.5">' + checklist.map(function (c) {
              return '<li><a href="#' + c.link + '" class="flex items-start gap-2 text-sm hover:underline">' +
                '<span class="flex-shrink-0 w-5 h-5 rounded-full text-xs flex items-center justify-center font-bold ' +
                (c.ok ? 'bg-green-100 text-green-700">✓' : 'bg-amber-100 text-amber-700">!') + '</span>' +
                '<span class="' + (c.ok ? 'text-gray-600' : 'text-gray-900 font-medium') + '">' + App.esc(c.text) + '</span></a></li>';
            }).join('') + '</ul>' +
          '</div>' +
        '</div>' +

        '<div class="card p-5 mt-4">' +
          '<div class="flex items-center justify-between mb-2"><h2 class="font-semibold">กิจกรรมล่าสุด</h2><a href="#/admin/audit" class="text-sm text-brand-600 hover:underline">ดูทั้งหมด →</a></div>' +
          (d.recentActivity.length ? '<ul class="divide-y divide-gray-100">' + d.recentActivity.map(function (a) {
            return '<li class="py-2 flex items-center justify-between gap-3 text-sm"><span><b class="font-mono text-xs">' + App.esc(a.actorId) + '</b> ' +
              App.esc(a.actionLabel) + (a.target ? ' <span class="text-gray-500">· ' + App.esc(a.target) + '</span>' : '') + '</span>' +
              '<span class="text-xs text-gray-400 whitespace-nowrap">' + App.esc(App.dateTime(a.timestamp)) + '</span></li>';
          }).join('') + '</ul>' : '<p class="text-sm text-gray-400">ยังไม่มีกิจกรรม</p>') +
        '</div>';

      if (d.trend.length) drawTrend(document.getElementById('trend-chart'), d.trend);
    }

    function tile(caption, value, note) {
      return '<div class="card p-4 stat-tile"><div class="caption">' + caption + '</div>' +
        '<div class="value mt-1">' + value + '</div><div class="text-xs text-gray-500 mt-0.5">' + note + '</div></div>';
    }

    /** กราฟแท่งแนวตั้ง 1 ชุดข้อมูล: แท่งหนาไม่เกิน 24px มุมบนโค้ง 4px, เส้นกริดจาง, tooltip เมื่อชี้, ป้ายค่าเฉพาะเดือนล่าสุด */
    function drawTrend(el, data) {
      var W = 640, H = 230, m = { l: 64, r: 16, t: 24, b: 40 };
      var pw = W - m.l - m.r, ph = H - m.t - m.b;
      var max = Math.max.apply(null, data.map(function (d) { return d.netPay; })) || 1;
      var step = niceStep(max / 5);
      var top = Math.ceil(max / step) * step;
      var y = function (v) { return m.t + ph - (v / top) * ph; };
      var band = pw / data.length;
      var bw = Math.min(24, band * 0.5);

      var grid = '';
      for (var v = 0; v <= top + 1e-6; v += step) {
        grid += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#e7ebf3" stroke-width="1"/>' +
          '<text x="' + (m.l - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="#6b7690">' + App.money0(v) + '</text>';
      }
      var bars = data.map(function (d, i) {
        var cx = m.l + band * i + band / 2, x = cx - bw / 2, y0 = m.t + ph, y1 = y(d.netPay), r = Math.min(4, (y0 - y1) / 2);
        var path = 'M' + x + ',' + y0 + 'V' + (y1 + r) + 'Q' + x + ',' + y1 + ' ' + (x + r) + ',' + y1 + 'H' + (x + bw - r) +
          'Q' + (x + bw) + ',' + y1 + ' ' + (x + bw) + ',' + (y1 + r) + 'V' + y0 + 'Z';
        var isLast = i === data.length - 1;
        return '<path d="' + path + '" fill="' + (d.status === 'approved' ? '#264ed6' : '#8cb1ff') + '"/>' +
          (isLast ? '<text x="' + cx + '" y="' + (y1 - 6) + '" text-anchor="middle" font-size="11" font-weight="600" fill="#1a2f6e">' + App.money0(d.netPay) + '</text>' : '') +
          '<text x="' + cx + '" y="' + (H - m.b + 16) + '" text-anchor="middle" font-size="11" fill="#445">' + App.esc(d.monthLabel) + '</text>' +
          (d.status !== 'approved' ? '<text x="' + cx + '" y="' + (H - m.b + 30) + '" text-anchor="middle" font-size="10" fill="#92640a">ร่าง</text>' : '') +
          '<rect class="hit" data-i="' + i + '" x="' + (m.l + band * i) + '" y="' + m.t + '" width="' + band + '" height="' + ph + '" fill="transparent"/>';
      }).join('');

      el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="w-full h-auto" role="img" aria-label="กราฟยอดโอนสุทธิรายเดือน">' + grid +
        '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + (m.t + ph) + '" y2="' + (m.t + ph) + '" stroke="#c7d2e8"/>' + bars + '</svg>' +
        '<div class="chart-tip hidden"></div>';

      var tip = el.querySelector('.chart-tip');
      el.querySelectorAll('.hit').forEach(function (h) {
        h.addEventListener('mousemove', function (ev) {
          var d = data[parseInt(h.getAttribute('data-i'), 10)];
          var box = el.getBoundingClientRect();
          tip.innerHTML = '<b>' + App.esc(d.monthLabel) + '</b> · ' + App.money(d.netPay) + ' บาท<br>' + d.headcount + ' คน · ' + (d.status === 'approved' ? 'อนุมัติแล้ว' : 'ร่าง');
          tip.style.left = (ev.clientX - box.left) + 'px';
          tip.style.top = (ev.clientY - box.top) + 'px';
          tip.classList.remove('hidden');
        });
        h.addEventListener('mouseleave', function () { tip.classList.add('hidden'); });
      });
    }

    function niceStep(raw) {
      var p = Math.pow(10, Math.floor(Math.log10(raw || 1)));
      var n = raw / p;
      return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
    }
  };
</script>
